<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Push Notifications Admin Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .content {
            padding: 40px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            border-left: 4px solid #ff6b6b;
        }
        
        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #ff6b6b;
            margin-bottom: 5px;
        }
        
        .stat-label {
            color: #666;
            font-size: 0.9em;
        }
        
        .form-section {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }
        
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #ff6b6b;
        }
        
        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        .btn {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 1.1em;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-right: 10px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .btn-secondary {
            background: #6c757d;
        }
        
        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        
        .alert.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .alert.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .notification-history {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .history-item {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            border-left: 4px solid #ff6b6b;
        }
        
        .history-item:last-child {
            margin-bottom: 0;
        }
        
        .history-title {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        
        .history-body {
            color: #666;
            margin-bottom: 5px;
        }
        
        .history-meta {
            font-size: 0.9em;
            color: #999;
        }
        
        .back-link {
            text-align: center;
            margin-top: 30px;
        }
        
        .back-link a {
            color: #ff6b6b;
            text-decoration: none;
            font-weight: bold;
        }
        
        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Admin Panel</h1>
            <p>Send Push Notifications to All Connected Devices</p>
        </div>
        
        <div class="content">
            <div class="stats-grid">
                <div class="stat-card">
                    <div id="total-tokens" class="stat-number">0</div>
                    <div class="stat-label">Connected Devices</div>
                </div>
                <div class="stat-card">
                    <div id="notifications-sent" class="stat-number">0</div>
                    <div class="stat-label">Notifications Sent</div>
                </div>
            </div>
            
            <div class="form-section">
                <h2>📤 Send Notification</h2>
                
                <div id="alert" class="alert"></div>
                
                <form id="notification-form">
                    <div class="form-group">
                        <label for="title">Notification Title *</label>
                        <input type="text" id="title" name="title" required placeholder="Enter notification title">
                    </div>
                    
                    <div class="form-group">
                        <label for="body">Notification Body *</label>
                        <textarea id="body" name="body" required placeholder="Enter notification message"></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="data">Additional Data (JSON format - optional)</label>
                        <textarea id="data" name="data" placeholder='{"key": "value", "url": "https://example.com"}'></textarea>
                    </div>
                    
                    <button type="submit" class="btn" id="send-btn">Send Notification</button>
                    <button type="button" class="btn btn-secondary" id="refresh-stats">Refresh Stats</button>
                </form>
            </div>
            
            <div class="notification-history">
                <h3>📋 Notification History</h3>
                <div id="history-list">
                    <p style="color: #999; text-align: center; padding: 20px;">No notifications sent yet</p>
                </div>
            </div>
            
            <div class="back-link">
                <a href="/">← Back to Main App</a>
            </div>
        </div>
    </div>

    <script>
        // DOM elements
        const totalTokensEl = document.getElementById('total-tokens');
        const notificationsSentEl = document.getElementById('notifications-sent');
        const alertEl = document.getElementById('alert');
        const notificationForm = document.getElementById('notification-form');
        const sendBtn = document.getElementById('send-btn');
        const refreshBtn = document.getElementById('refresh-stats');
        const historyList = document.getElementById('history-list');
        
        let notificationsSent = 0;

        // Show alert message
        function showAlert(message, type = 'success') {
            alertEl.textContent = message;
            alertEl.className = `alert ${type}`;
            alertEl.style.display = 'block';
            
            setTimeout(() => {
                alertEl.style.display = 'none';
            }, 5000);
        }

        // Add notification to history
        function addToHistory(title, body, result) {
            const historyItem = document.createElement('div');
            historyItem.className = 'history-item';
            
            const time = new Date().toLocaleString();
            const status = result.success ? 'Success' : 'Failed';
            const statusColor = result.success ? '#28a745' : '#dc3545';
            
            historyItem.innerHTML = `
                <div class="history-title">${title}</div>
                <div class="history-body">${body}</div>
                <div class="history-meta">
                    <span style="color: ${statusColor}; font-weight: bold;">${status}</span> • 
                    ${result.successCount || 0} delivered • 
                    ${result.failureCount || 0} failed • 
                    ${time}
                </div>
            `;
            
            // Clear "no notifications" message
            if (historyList.children.length === 1 && historyList.children[0].tagName === 'P') {
                historyList.innerHTML = '';
            }
            
            historyList.insertBefore(historyItem, historyList.firstChild);
        }

        // Fetch and update stats
        async function updateStats() {
            try {
                const response = await fetch('/api/tokens');
                const data = await response.json();
                totalTokensEl.textContent = data.totalTokens;
            } catch (error) {
                console.error('Error fetching stats:', error);
                showAlert('Failed to fetch stats', 'error');
            }
        }

        // Send notification
        async function sendNotification(formData) {
            try {
                sendBtn.disabled = true;
                sendBtn.textContent = 'Sending...';
                
                const response = await fetch('/api/send-notification', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData),
                });
                
                const result = await response.json();
                
                if (result.success) {
                    notificationsSent++;
                    notificationsSentEl.textContent = notificationsSent;
                    showAlert(`Notification sent successfully! ${result.successCount} delivered, ${result.failureCount} failed.`, 'success');
                    addToHistory(formData.title, formData.body, result);
                    notificationForm.reset();
                    await updateStats(); // Refresh stats after sending
                } else {
                    showAlert(result.error || 'Failed to send notification', 'error');
                }
                
            } catch (error) {
                console.error('Error sending notification:', error);
                showAlert('Network error: Failed to send notification', 'error');
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = 'Send Notification';
            }
        }

        // Event listeners
        notificationForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = {
                title: document.getElementById('title').value,
                body: document.getElementById('body').value,
                data: {}
            };
            
            // Parse additional data if provided
            const dataInput = document.getElementById('data').value.trim();
            if (dataInput) {
                try {
                    formData.data = JSON.parse(dataInput);
                } catch (error) {
                    showAlert('Invalid JSON format in additional data field', 'error');
                    return;
                }
            }
            
            await sendNotification(formData);
        });

        refreshBtn.addEventListener('click', updateStats);

        // Initialize
        updateStats();
        
        // Auto-refresh stats every 30 seconds
        setInterval(updateStats, 30000);
    </script>
</body>
</html>
